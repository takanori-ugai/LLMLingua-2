# .github/workflows/pr-agent.yml
name: PR Agent

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  pr_agent_job:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Check OPENAI_KEY
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
        run: |
          if [ -z "$OPENAI_KEY" ]; then
            echo "::error::OPENAI_KEY is missing"
            exit 1
          fi
          echo "OPENAI_KEY is available"

      - name: PR Agent
        uses: the-pr-agent/pr-agent@main
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
